name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Download Nunito Black (display font, optional)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Nunito-Black.ttf \
            https://github.com/googlefonts/nunito/raw/main/fonts/TTF/Nunito-Black.ttf || echo "Nunito not downloaded, using system font"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Shortstop-APK
          path: app/build/outputs/apk/debug/app-debug.apk
