name: Device test (emulator)
on:
  workflow_dispatch:
  # runs only when this workflow or the script changes (workflow_dispatch needs the file on the default branch, which stays untouched)
  push:
    branches: [orange-rig]
    paths: ['scripts/device-test.sh', 'scripts/ui.py', '.github/workflows/device-test.yml']
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run scenarios on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            timeout 1700 bash scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-shots
          path: shots/
